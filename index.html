<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영단어 플립 카드 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f0fdf4; /* 연한 초록 배경 */
        }

        .perspective {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        
        /* 스크롤바 숨기기 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #86efac; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4ade80; }
        
        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body class="min-h-screen text-gray-800">

    <header class="bg-green-500 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            <span>🎴</span> 영단어 플립 게임
        </h1>
        <div id="userInfoDisplay" class="hidden text-sm md:text-base bg-green-600 px-3 py-1 rounded-full">
            <!-- 사용자 정보 표시 -->
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-4xl">
        
        <!-- 1. 로그인 화면 -->
        <section id="loginScreen" class="screen active max-w-md mx-auto mt-10">
            <div class="bg-white p-8 rounded-2xl shadow-xl border-4 border-green-100">
                <h2 class="text-3xl font-bold text-center text-green-600 mb-6">입학하기</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">학교 이름</label>
                        <input type="text" id="schoolName" class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-500 outline-none" placeholder="예: 행복초등학교">
                        <p class="text-xs text-gray-500 mt-1">* 같은 학교 이름을 입력해야 함께 게임할 수 있어요!</p>
                    </div>
                    
                    <div id="studentFields" class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">학년</label>
                            <select id="grade" class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-500 outline-none">
                                <option value="">선택</option>
                                <option value="1학년">1학년</option>
                                <option value="2학년">2학년</option>
                                <option value="3학년">3학년</option>
                                <option value="4학년">4학년</option>
                                <option value="5학년">5학년</option>
                                <option value="6학년">6학년</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">반</label>
                            <select id="classNum" class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-500 outline-none">
                                <option value="">선택</option>
                                <option value="1반">1반</option><option value="2반">2반</option>
                                <option value="3반">3반</option><option value="4반">4반</option>
                                <option value="5반">5반</option><option value="6반">6반</option>
                                <option value="7반">7반</option><option value="8반">8반</option>
                                <option value="9반">9반</option><option value="10반">10반</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">번호</label>
                            <input type="number" id="studentNum" class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-500 outline-none" placeholder="번호">
                        </div>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">이름</label>
                        <input type="text" id="playerName" class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-500 outline-none" placeholder="이름을 입력하세요">
                    </div>
                    
                    <div class="pt-4 flex flex-col gap-3">
                        <button onclick="login(false)" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-colors text-lg">
                            🎓 학생 입학하기
                        </button>
                        <button onclick="login(true)" class="w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-colors text-lg">
                            👨‍🏫 선생님 로그인
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. 학생 메인 로비 -->
        <section id="studentScreen" class="screen mt-8">
            <div class="grid md:grid-cols-2 gap-6">
                <!-- 게임 모드 선택 -->
                <div class="bg-white p-6 rounded-2xl shadow-lg border-2 border-green-100 flex flex-col gap-4">
                    <h2 class="text-2xl font-bold text-green-600 mb-2">🎮 게임하기</h2>
                    <button onclick="openUnitSelect('single')" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-4 rounded-xl shadow-md text-xl transition-transform hover:scale-105">
                        혼자 하기 (연습 모드)
                    </button>
                    <div class="border-t-2 border-gray-100 my-2"></div>
                    <button onclick="openUnitSelect('host')" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 px-4 rounded-xl shadow-md text-xl transition-transform hover:scale-105">
                        친구와 하기 (방 만들기)
                    </button>
                    <div class="flex gap-2">
                        <input type="number" id="joinRoomCode" class="flex-1 p-3 border-2 border-gray-200 rounded-xl text-center text-xl font-bold tracking-widest" placeholder="방 코드 (4자리)">
                        <button onclick="joinRoom()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-colors">
                            입장
                        </button>
                    </div>
                </div>

                <!-- 명예의 전당 (개인 랭킹) -->
                <div class="bg-white p-6 rounded-2xl shadow-lg border-2 border-yellow-100">
                    <h2 class="text-2xl font-bold text-yellow-500 mb-4 flex items-center gap-2">
                        🏆 명예의 전당
                        <span class="text-sm text-gray-500 font-normal ml-auto">(혼자 하기 기록)</span>
                    </h2>
                    <div class="bg-yellow-50 rounded-xl p-4 h-64 overflow-y-auto" id="hofList">
                        <!-- 랭킹 목록 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. 교사 설정 화면 -->
        <section id="teacherScreen" class="screen mt-8">
            <div class="bg-white p-6 rounded-2xl shadow-lg border-2 border-gray-200 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-700">👨‍🏫 교사 관리 모드</h2>
                    <button onclick="logout()" class="text-sm bg-red-100 text-red-600 px-3 py-1 rounded-lg hover:bg-red-200">로그아웃</button>
                </div>
                
                <div class="grid md:grid-cols-2 gap-6">
                    <!-- 단원 및 단어 관리 -->
                    <div class="space-y-4">
                        <h3 class="text-xl font-bold text-green-600 border-b pb-2">📚 단어 관리</h3>
                        
                        <div class="flex gap-2">
                            <input type="text" id="newUnitName" class="flex-1 p-2 border-2 border-gray-200 rounded-lg" placeholder="새 단원명 (예: 1단원. Hello)">
                            <button onclick="addUnit()" class="bg-green-500 text-white px-4 py-2 rounded-lg font-bold">단원 추가</button>
                        </div>
                        
                        <select id="teacherUnitSelect" onchange="loadWordsForTeacher()" class="w-full p-2 border-2 border-green-200 rounded-lg bg-green-50 font-bold">
                            <option value="">단원을 선택하세요</option>
                        </select>

                        <div id="wordManagementArea" class="hidden flex-col gap-2">
                            <p class="text-sm text-gray-600 font-bold mt-2">일괄 등록 (단어와 뜻을 쉼표나 콜론으로 구분해서 여러 줄 입력)</p>
                            <textarea id="bulkWordsInput" class="w-full p-2 border-2 border-gray-200 rounded-lg h-32" placeholder="apple, 사과&#10;banana: 바나나&#10;cat, 고양이"></textarea>
                            <button onclick="addBulkWords()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">단어 한꺼번에 등록하기</button>
                            
                            <div id="wordList" class="mt-4 max-h-40 overflow-y-auto space-y-2 bg-gray-50 p-2 rounded-lg border">
                                <!-- 등록된 단어 목록 -->
                            </div>
                        </div>
                    </div>

                    <!-- 게임 설정 및 학생 DB -->
                    <div class="space-y-4">
                        <h3 class="text-xl font-bold text-purple-600 border-b pb-2">⚙️ 게임 설정</h3>
                        <div class="bg-purple-50 p-4 rounded-xl border border-purple-100 flex justify-between items-center">
                            <span>한 게임당 사용할 카드 짝 개수:</span>
                            <select id="settingPairCount" onchange="saveSettings()" class="p-2 rounded-lg border-2 border-purple-200 font-bold text-purple-700 outline-none">
                                <option value="4">4쌍 (8장)</option>
                                <option value="6">6쌍 (12장)</option>
                                <option value="8">8쌍 (16장)</option>
                                <option value="10">10쌍 (20장)</option>
                                <option value="12">12쌍 (24장)</option>
                            </select>
                        </div>

                        <h3 class="text-xl font-bold text-orange-600 border-b pb-2 mt-6">👥 학생 목록</h3>
                        <div class="bg-orange-50 p-4 rounded-xl border border-orange-100 h-48 overflow-y-auto" id="studentList">
                            <!-- 학생 목록 -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. 멀티플레이 대기실 -->
        <section id="lobbyScreen" class="screen mt-8">
            <div class="bg-white p-8 rounded-2xl shadow-lg border-4 border-purple-200 max-w-2xl mx-auto text-center">
                <h2 class="text-3xl font-bold text-purple-600 mb-2">게임 대기실</h2>
                <div class="my-6 p-4 bg-purple-50 rounded-xl inline-block">
                    <p class="text-gray-600 mb-1">초대 코드</p>
                    <p class="text-5xl font-extrabold text-purple-700 tracking-widest" id="displayRoomCode">----</p>
                </div>
                
                <div class="bg-gray-50 rounded-xl p-4 mb-6 text-left">
                    <h3 class="font-bold text-gray-700 mb-2 border-b pb-2">참가자 목록 (<span id="playerCount">1</span>/4)</h3>
                    <ul id="lobbyPlayerList" class="space-y-2 font-bold text-lg text-gray-600">
                        <!-- 참가자 -->
                    </ul>
                </div>

                <div class="flex gap-4 justify-center">
                    <button onclick="leaveRoom()" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-colors">
                        나가기
                    </button>
                    <button id="btnStartGame" onclick="startMultiGame()" class="hidden bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-colors text-xl">
                        게임 시작!
                    </button>
                </div>
            </div>
        </section>

        <!-- 5. 게임 화면 (공통) -->
        <section id="gameScreen" class="screen mt-4">
            <div class="flex justify-between items-center mb-4 bg-white p-4 rounded-xl shadow-sm border-2 border-green-100">
                <div class="text-xl font-bold text-gray-700" id="gameModeDisplay">혼자 하기</div>
                <div class="flex gap-6">
                    <div class="text-center">
                        <p class="text-sm text-gray-500">시간</p>
                        <p class="text-2xl font-bold text-blue-600" id="timerDisplay">00:00</p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm text-gray-500">남은 짝</p>
                        <p class="text-2xl font-bold text-red-500" id="pairsLeftDisplay">0</p>
                    </div>
                </div>
                <button onclick="quitGame()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                    그만하기
                </button>
            </div>

            <!-- 스코어보드 (멀티플레이 시 표시) -->
            <div id="multiScoreBoard" class="hidden flex justify-center gap-4 mb-4">
                <!-- 동적으로 추가됨 -->
            </div>

            <!-- 카드 보드 -->
            <div id="gameBoard" class="grid gap-3 sm:gap-4 mx-auto max-w-3xl">
                <!-- 카드가 렌더링됩니다 -->
            </div>
        </section>

    </main>

    <!-- 단원 선택 모달 -->
    <div id="unitModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full mx-4">
            <h3 class="text-2xl font-bold text-green-600 mb-4 text-center">단원 선택</h3>
            <select id="modalUnitSelect" class="w-full p-3 border-2 border-green-200 rounded-xl font-bold text-gray-700 outline-none mb-6">
                <option value="">단원을 선택하세요</option>
            </select>
            <div class="flex gap-3">
                <button onclick="closeUnitModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-xl">취소</button>
                <button onclick="confirmUnitSelection()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl">확인</button>
            </div>
        </div>
    </div>

    <!-- 알림 모달 -->
    <div id="alertModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-200" id="alertModalContent">
            <div class="text-4xl mb-4" id="alertIcon">🔔</div>
            <h3 class="text-xl font-bold text-gray-800 mb-2" id="alertTitle">알림</h3>
            <p class="text-gray-600 mb-6" id="alertMessage">메시지 내용</p>
            <button onclick="closeAlert()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-xl transition-colors">
                확인
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getFirestore, collection, doc, setDoc, getDoc, addDoc, 
            getDocs, updateDoc, deleteDoc, query, where, onSnapshot, orderBy, limit 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAaRTZlJ_fQAKl8j0lCJfaOdJyx8wMP5Zo",
            authDomain: "tournament-267ab.firebaseapp.com",
            projectId: "tournament-267ab",
            storageBucket: "tournament-267ab.firebasestorage.app",
            messagingSenderId: "401796751337",
            appId: "1:401796751337:web:6f3ba64fde25adf1a8f578",
            measurementId: "G-WMY07DTGFZ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // 전역 상태
        let currentUser = null;
        let gameSettings = { pairCount: 6 }; // 기본 6쌍(12장)
        let units = []; // 단원 목록
        
        // 게임 상태
        let currentGameMode = null; // 'single' | 'multi'
        let currentRoomId = null;
        let isHost = false;
        let unsubscribeRoom = null;
        
        let cards = [];
        let flippedIndices = [];
        let matchedPairs = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isGameLocked = false;
        
        let pendingAction = null; // 단원 선택 후 실행할 액션 저장 ('single' or 'host')

        // -------------------------
        // 유틸리티 함수
        // -------------------------
        window.showAlert = function(title, message, icon = '🔔') {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('alertIcon').innerText = icon;
            const modal = document.getElementById('alertModal');
            const content = document.getElementById('alertModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.replace('scale-95', 'scale-100'), 10);
        }
        window.closeAlert = function() {
            const modal = document.getElementById('alertModal');
            const content = document.getElementById('alertModalContent');
            content.classList.replace('scale-100', 'scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 이름 가운데 별표 처리 함수 (예: 홍길동 -> 홍*동, 이순 -> 이*, 남궁민수 -> 남**수)
        function maskName(name) {
            if (!name) return "";
            if (name.length <= 2) {
                return name.charAt(0) + '*';
            }
            const first = name.charAt(0);
            const last = name.charAt(name.length - 1);
            const middle = '*'.repeat(name.length - 2);
            return first + middle + last;
        }

        // 배열 셔플 알고리즘
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 랜덤 4자리 방 코드 생성
        function generateRoomCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        // -------------------------
        // 로그인 및 초기화
        // -------------------------
        window.login = async function(isTeacher) {
            const schoolName = document.getElementById('schoolName').value.trim();
            const playerName = document.getElementById('playerName').value.trim();
            
            if (!schoolName) return showAlert('입력 오류', '학교 이름을 정확히 입력해주세요.', '🏫');
            if (!playerName) return showAlert('입력 오류', '이름을 입력해주세요.', '👤');

            let grade = "", classNum = "", studentNum = "";
            
            if (!isTeacher) {
                grade = document.getElementById('grade').value;
                classNum = document.getElementById('classNum').value;
                studentNum = document.getElementById('studentNum').value.trim();
                
                if (!grade || !classNum || !studentNum) {
                    return showAlert('입력 오류', '학년, 반, 번호를 모두 선택/입력해주세요.', '📋');
                }
            }

            currentUser = {
                school: schoolName,
                name: playerName,
                isTeacher: isTeacher,
                grade: grade,
                classNum: classNum,
                studentNum: studentNum,
                uid: `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`
            };

            // 사용자 정보 화면 표시
            const infoDiv = document.getElementById('userInfoDisplay');
            infoDiv.classList.remove('hidden');
            infoDiv.innerHTML = `🏫 ${schoolName} | ${isTeacher ? '👨‍🏫 선생님' : `🎓 ${grade} ${classNum} ${playerName}`}`;

            // 학교별 설정 로드
            await loadSchoolSettings();
            await loadUnits();

            if (isTeacher) {
                showScreen('teacherScreen');
                loadStudentsForTeacher();
            } else {
                // 학생 정보 DB 저장
                try {
                    const userRef = doc(db, `schools/${schoolName}/users`, currentUser.uid);
                    await setDoc(userRef, currentUser);
                } catch (e) {
                    console.error("Error saving user: ", e);
                }
                showScreen('studentScreen');
                loadHallOfFame();
            }
        }

        window.logout = function() {
            currentUser = null;
            document.getElementById('userInfoDisplay').classList.add('hidden');
            showScreen('loginScreen');
        }

        // 학교 설정 로드 (카드 개수)
        async function loadSchoolSettings() {
            try {
                const settingsRef = doc(db, `schools/${currentUser.school}/settings`, 'game');
                const docSnap = await getDoc(settingsRef);
                if (docSnap.exists()) {
                    gameSettings = docSnap.data();
                    if(document.getElementById('settingPairCount')) {
                        document.getElementById('settingPairCount').value = gameSettings.pairCount || 6;
                    }
                }
            } catch (e) { console.error(e); }
        }

        // -------------------------
        // 교사 기능 (단원 & 단어 관리)
        // -------------------------
        window.saveSettings = async function() {
            if(!currentUser?.isTeacher) return;
            const count = parseInt(document.getElementById('settingPairCount').value);
            try {
                await setDoc(doc(db, `schools/${currentUser.school}/settings`, 'game'), { pairCount: count });
                gameSettings.pairCount = count;
                showAlert('저장 완료', '게임 설정이 저장되었습니다.', '✅');
            } catch (e) { showAlert('오류', '설정 저장 실패', '❌'); }
        }

        async function loadUnits() {
            try {
                const q = query(collection(db, `schools/${currentUser.school}/units`), orderBy('createdAt'));
                const querySnapshot = await getDocs(q);
                units = [];
                querySnapshot.forEach((doc) => {

            if(!unitId) {
                wordArea.classList.add('hidden');
                return;

                const querySnapshot = await getDocs(q);

                    `;
                });

        window.addBulkWords = async function() {
            const unitId = document.getElementById('teacherUnitSelect').value;
            if(!unitId) return showAlert('알림', '단원을 먼저 선택하세요.', '⚠️');
            
            const text = document.getElementById('bulkWordsInput').value;
            if(!text.trim()) return showAlert('알림', '등록할 단어를 입력하세요.', '⚠️');

            const lines = text.split('\n');
            let successCount = 0;
            
            for(let line of lines) {
                if(!line.trim()) continue;
                // 콤마(,) 또는 콜론(:)으로 분리
                const parts = line.split(/[,:]/);
                if(parts.length >= 2) {
                    const word = parts[0].trim();
                    const meaning = parts[1].trim();
                    if(word && meaning) {
                        try {
                            await addDoc(collection(db, `schools/${currentUser.school}/words`), {
                                unitId: unitId,
                                word: word,
                                meaning: meaning,
                                createdAt: Date.now()
                            });
                            successCount++;
                        } catch(e) { console.error(e); }
                    }
                }
            }
            
            document.getElementById('bulkWordsInput').value = '';
            showAlert('완료', `총 ${successCount}개의 단어가 등록되었습니다.`, '🎉');
            loadWordsForTeacher();
        }

        window.deleteWord = async function(wordId) {
            try {
                await deleteDoc(doc(db, `schools/${currentUser.school}/words`, wordId));
                loadWordsForTeacher();
            } catch(e) { console.error(e); }
        }

        // -------------------------
        // 게임 준비 (단원 선택)

        window.openUnitSelect = function(action) {
            if(units.length === 0) {
                return showAlert('알림', '선생님이 등록하신 단원이 아직 없습니다.', '😢');

            if(!unitId) return showAlert('알림', '단원을 선택해주세요.', '⚠️');

        async function fetchWordsForGame(unitId, pairCount) {
            const q = query(collection(db, `schools/${currentUser.school}/words`), where("unitId", "==", unitId));
            const querySnapshot = await getDocs(q);
            let allWords = [];
            querySnapshot.forEach(doc => allWords.push(doc.data()));
            
            if(allWords.length < pairCount) {
                showAlert('단어 부족', `해당 단원에 단어가 부족합니다. (최소 ${pairCount}개 필요, 현재 ${allWords.length}개)`, '⚠️');
                return null;
            }
            
            // 랜덤으로 섞어서 필요한 만큼 추출
            allWords = shuffle(allWords).slice(0, pairCount);
            
            let gameCards = [];
            allWords.forEach((item, index) => {
                const pairId = `pair_${index}`;
                gameCards.push({ id: `word_${index}`, pairId: pairId, type: 'word', content: item.word, isFlipped: false, isMatched: false, matchedBy: null });
                gameCards.push({ id: `mean_${index}`, pairId: pairId, type: 'meaning', content: item.meaning, isFlipped: false, isMatched: false, matchedBy: null });
            });
            
            return shuffle(gameCards);
        }

        // -------------------------
        // 1인용 게임 로직
        // -------------------------
        async function startSingleGame(unitId) {
            const pairCount = gameSettings.pairCount || 6;
            const newCards = await fetchWordsForGame(unitId, pairCount);
            if(!newCards) return;

            currentGameMode = 'single';
            cards = newCards;
            matchedPairs = 0;
            flippedIndices = [];
            isGameLocked = false;
            
            document.getElementById('gameModeDisplay').innerText = "혼자 하기 (연습 모드)";
            document.getElementById('multiScoreBoard').classList.add('hidden');
            document.getElementById('pairsLeftDisplay').innerText = pairCount;
            
            showScreen('gameScreen');
            renderBoard();
            startTimer();
        }

        // -------------------------
        // 멀티플레이 방 관리 로직
        // -------------------------
        async function createRoom(unitId) {
            const pairCount = gameSettings.pairCount || 6;
            const newCards = await fetchWordsForGame(unitId, pairCount);
            if(!newCards) return;

            const roomCode = generateRoomCode();
            currentRoomId = roomCode;
            isHost = true;
            
            const roomData = {
                code: roomCode,
                host: currentUser.name,
                unitId: unitId,
                status: 'waiting',
                players: [{ name: currentUser.name, uid: currentUser.uid, score: 0 }],
                cards: newCards,
                createdAt: Date.now(),
                pairsLeft: pairCount
            };
            
            try {
                await setDoc(doc(db, `schools/${currentUser.school}/rooms`, roomCode), roomData);
                joinRoomLobby(roomCode);
            } catch(e) { console.error(e); showAlert('오류', '방 생성 실패', '❌'); }
        }

        window.joinRoom = async function() {
            const code = document.getElementById('joinRoomCode').value.trim();
            if(code.length !== 4) return showAlert('알림', '4자리 방 코드를 입력하세요.', '🔑');
            
            try {
                const roomRef = doc(db, `schools/${currentUser.school}/rooms`, code);
                const docSnap = await getDoc(roomRef);
                
                if (!docSnap.exists()) return showAlert('오류', '방을 찾을 수 없습니다.', '❌');
                const roomData = docSnap.data();
                if (roomData.status !== 'waiting') return showAlert('오류', '이미 게임이 시작되었거나 종료된 방입니다.', '❌');
                if (roomData.players.length >= 4) return showAlert('오류', '방이 꽉 찼습니다.', '❌');
                
                // 플레이어 추가
                const newPlayers = [...roomData.players, { name: currentUser.name, uid: currentUser.uid, score: 0 }];
                await updateDoc(roomRef, { players: newPlayers });
                
                currentRoomId = code;
                isHost = false;
                joinRoomLobby(code);
            } catch(e) { console.error(e); showAlert('오류', '방 입장 실패', '❌'); }
        }

        function joinRoomLobby(roomCode) {
            showScreen('lobbyScreen');
            document.getElementById('displayRoomCode').innerText = roomCode;
            document.getElementById('btnStartGame').classList.toggle('hidden', !isHost);
            
            // 실시간 리스너 연결
            const roomRef = doc(db, `schools/${currentUser.school}/rooms`, roomCode);
            unsubscribeRoom = onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) {
                    showAlert('알림', '방이 호스트에 의해 삭제되었습니다.', '💥');
                    leaveRoom(false);
                    return;
                }
                const data = docSnap.data();
                updateLobbyUI(data);
                
                if (data.status === 'playing' && currentGameMode !== 'multi') {
                    // 호스트가 시작 버튼을 누름
                    initMultiGameUI(data);
                } else if (data.status === 'playing' && currentGameMode === 'multi') {
                    // 게임 중 데이터 동기화
                    syncMultiGameData(data);
                }
            });
        }

        function updateLobbyUI(data) {
            document.getElementById('playerCount').innerText = data.players.length;
            const list = document.getElementById('lobbyPlayerList');
            list.innerHTML = data.players.map(p => 
                `<li class="flex items-center gap-2">
                    ${p.name === data.host ? '👑' : '👤'} ${p.name}
                </li>`
            ).join('');
        }

        window.leaveRoom = async function(updateDb = true) {
            if(unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
            if (updateDb && currentRoomId) {
                try {
                    const roomRef = doc(db, `schools/${currentUser.school}/rooms`, currentRoomId);
                    const docSnap = await getDoc(roomRef);
                    if(docSnap.exists()) {
                        const data = docSnap.data();
                        if(isHost) {
                            await deleteDoc(roomRef); // 호스트가 나가면 방 삭제
                        } else {
                            const newPlayers = data.players.filter(p => p.uid !== currentUser.uid);
                            await updateDoc(roomRef, { players: newPlayers });
                        }
                    }
                } catch(e) { console.error(e); }
            }
            currentRoomId = null;
            isHost = false;
            currentGameMode = null;
            showScreen('studentScreen');
        }

        window.startMultiGame = async function() {
            if(!isHost || !currentRoomId) return;
            try {
                await updateDoc(doc(db, `schools/${currentUser.school}/rooms`, currentRoomId), {
                    status: 'playing',
                    startTime: Date.now()
                });
            } catch(e) { console.error(e); }
        }

        function initMultiGameUI(data) {
            currentGameMode = 'multi';
            cards = data.cards;
            matchedPairs = 0;
            isGameLocked = false;
            
            document.getElementById('gameModeDisplay').innerText = `멀티플레이 (코드: ${currentRoomId})`;
            document.getElementById('pairsLeftDisplay').innerText = data.pairsLeft;
            
            const scoreBoard = document.getElementById('multiScoreBoard');
            scoreBoard.classList.remove('hidden');

            showScreen('gameScreen');
            renderBoard();

        function renderMultiScoreBoard(players) {
            const scoreBoard = document.getElementById('multiScoreBoard');
            scoreBoard.innerHTML = players.map(p => `
                <div class="bg-gray-100 px-4 py-2 rounded-xl text-center border-2 ${p.uid === currentUser.uid ? 'border-purple-400 bg-purple-50' : 'border-gray-200'}">
                    <p class="text-xs text-gray-500">${p.name}</p>
                    <p class="text-xl font-bold text-purple-700">${p.score}점</p>
                </div>
            `).join('');
        }

        function syncMultiGameData(data) {
            cards = data.cards;
            document.getElementById('pairsLeftDisplay').innerText = data.pairsLeft;
            renderMultiScoreBoard(data.players);
            renderBoard();
            
            if(data.pairsLeft === 0) {
                endGame();

        // -------------------------
        // 공통 게임 UI 렌더링
        // -------------------------
        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            
            // 카드 개수에 따른 그리드 설정
            const total = cards.length;
            if(total <= 8) board.className = 'grid gap-3 sm:gap-4 mx-auto max-w-2xl grid-cols-4'; // 4쌍
            else if(total <= 12) board.className = 'grid gap-3 sm:gap-4 mx-auto max-w-3xl grid-cols-4 md:grid-cols-4'; // 6쌍
            else if(total <= 16) board.className = 'grid gap-3 sm:gap-4 mx-auto max-w-4xl grid-cols-4 md:grid-cols-4'; // 8쌍
            else board.className = 'grid gap-2 sm:gap-3 mx-auto max-w-5xl grid-cols-4 md:grid-cols-5'; // 10쌍, 12쌍
            
            cards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                const isFlipping = card.isFlipped || card.isMatched;
                // 뒤집히지 않은 카드에만 마우스 오버 효과 (클릭 시 크기 커짐 방지)
                const interactClass = !isFlipping ? 'cursor-pointer hover:scale-105' : '';
                
                cardDiv.className = `perspective aspect-[4/3] sm:aspect-[4/3] w-full max-h-32 sm:max-h-40`;
                
                const innerClass = isFlipping ? 'rotate-y-180' : '';
                
                // 맞춘 카드 디자인 개선 (투명도 없애고 노란색 테두리 강조)
                const borderClass = card.isMatched ? 'border-yellow-400 border-[3px] shadow-[0_0_15px_rgba(250,204,21,0.5)]' : 'border-green-200 border-[3px]';
                const bgFrontColor = card.isMatched ? 'bg-yellow-50' : 'bg-white';
                
                // 텍스트 스타일: 단어는 파란색, 뜻은 짙은 회색
                const textStyle = card.type === 'word' ? 'text-lg sm:text-2xl text-blue-700 font-extrabold' : 'text-md sm:text-xl text-gray-700 font-bold';

                let matchedBanner = '';
                if(card.isMatched && card.matchedBy) {
                    matchedBanner = `<div class="absolute bottom-1 left-0 w-full text-center bg-yellow-400 text-yellow-900 text-[10px] sm:text-xs font-bold py-0.5">${card.matchedBy}</div>`;
                }

                cardDiv.innerHTML = `
                    <div class="relative w-full h-full transform-style-3d transition-transform ${innerClass} ${interactClass} z-10" onclick="handleCardClick(${index})">
                        <!-- 뒷면 (기본 덮여있는 상태) -->
                        <div class="absolute w-full h-full backface-hidden bg-gradient-to-br from-green-400 to-green-600 rounded-2xl shadow-md border-4 border-white flex items-center justify-center">
                            <span class="text-3xl sm:text-4xl text-white opacity-50">?</span>
                        </div>
                        <!-- 앞면 (내용 표시) -->
                        <div class="absolute w-full h-full backface-hidden ${bgFrontColor} rounded-2xl shadow-md flex flex-col items-center justify-center rotate-y-180 ${borderClass} p-2 overflow-hidden">
                            <span class="${textStyle} text-center break-keep leading-tight">${card.content}</span>
                            ${matchedBanner}
                        </div>
                    </div>
                `;
                board.appendChild(cardDiv);
            });
        }

        // -------------------------
        // 카드 클릭 및 매칭 확인 로직
        // -------------------------
        window.handleCardClick = async function(index) {
            if (isGameLocked || cards[index].isFlipped || cards[index].isMatched) return;

            if (currentGameMode === 'single') {
                handleSingleClick(index);
            } else if (currentGameMode === 'multi') {
                handleMultiClick(index);
            }
        }

        // 1인용 클릭 처리 (2초 딜레이 적용)
        function handleSingleClick(index) {
            cards[index].isFlipped = true;
            flippedIndices.push(index);
            renderBoard();

            if (flippedIndices.length === 2) {
                isGameLocked = true;
                const [idx1, idx2] = flippedIndices;
                
                if (cards[idx1].pairId === cards[idx2].pairId) {
                    // 맞힘 (딜레이 없이 바로 처리하거나 짧은 딜레이)
                    setTimeout(() => {
                        cards[idx1].isMatched = true;
                        cards[idx2].isMatched = true;
                        cards[idx1].matchedBy = maskName(currentUser.name);
                        cards[idx2].matchedBy = maskName(currentUser.name);
                        
                        matchedPairs++;
                        document.getElementById('pairsLeftDisplay').innerText = (cards.length/2) - matchedPairs;
                        flippedIndices = [];
                        isGameLocked = false;
                        renderBoard();

                        if (matchedPairs === cards.length / 2) endGame();
                    }, 500);
                } else {
                    // 틀림 (2초 딜레이 후 다시 뒤집음)
                    setTimeout(() => {
                        cards[idx1].isFlipped = false;
                        cards[idx2].isFlipped = false;
                        flippedIndices = [];
                        isGameLocked = false;
                        renderBoard();
                    }, 2000); // 2000ms = 2초
                }
            }
        }

        // 멀티플레이 클릭 처리
        async function handleMultiClick(index) {
            try {
                const roomRef = doc(db, `schools/${currentUser.school}/rooms`, currentRoomId);
                const docSnap = await getDoc(roomRef);
                if(!docSnap.exists()) return;
                
                const roomData = docSnap.data();
                const currentCards = roomData.cards;
                
                // 누군가 이미 뒤집었다면 무시
                if(currentCards[index].isFlipped || currentCards[index].isMatched) return;

                const currentlyFlipped = currentCards.filter(c => c.isFlipped && !c.isMatched);
                
                if (currentlyFlipped.length < 2) {
                    currentCards[index].isFlipped = true;
                    await updateDoc(roomRef, { cards: currentCards });
                    
                    // 만약 내가 방금 누른 것으로 2장이 뒤집혔다면 판정 수행 (제일 늦게 누른 사람이 판정)
                    const newFlipped = currentCards.filter(c => c.isFlipped && !c.isMatched);
                    if (newFlipped.length === 2) {
                        isGameLocked = true; // 다른 클라이언트의 클릭 방지 (로컬)
                        
                        const c1 = newFlipped[0];
                        const c2 = newFlipped[1];
                        
                        if (c1.pairId === c2.pairId) {
                            // 맞힘: 점수 증가 및 매치 상태 업데이트 (짧은 딜레이 후)
                            setTimeout(async () => {
                                c1.isMatched = true; c1.isFlipped = false; c1.matchedBy = maskName(currentUser.name);
                                c2.isMatched = true; c2.isFlipped = false; c2.matchedBy = maskName(currentUser.name);
                                
                                const newPlayers = roomData.players.map(p => {
                                    if(p.uid === currentUser.uid) return { ...p, score: p.score + 10 };
                                    return p;
                                });
                                
                                await updateDoc(roomRef, { 
                                    cards: currentCards,
                                    players: newPlayers,
                                    pairsLeft: roomData.pairsLeft - 1
                                });
                                isGameLocked = false;
                            }, 500);
                        } else {
                            // 틀림: 2초(2000ms) 대기 후 다시 뒤집기 
                            setTimeout(async () => {
                                // DB를 다시 읽어와 최신 상태에서 뒤집기 해제
                                const snap = await getDoc(roomRef);
                                if(snap.exists()) {
                                    const latestCards = snap.data().cards;
                                    const idx1 = latestCards.findIndex(c => c.id === c1.id);
                                    const idx2 = latestCards.findIndex(c => c.id === c2.id);
                                    if(idx1 !== -1) latestCards[idx1].isFlipped = false;
                                    if(idx2 !== -1) latestCards[idx2].isFlipped = false;
                                    await updateDoc(roomRef, { cards: latestCards });
                                }
                                isGameLocked = false;
                            }, 2000);
                        }
                    }
                }
            } catch(e) { console.error("Error clicking card: ", e); }
        }

        // -------------------------
        // 타이머 및 종료
        // -------------------------
        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById('timerDisplay').innerText = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const s = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timerDisplay').innerText = `${m}:${s}`;
            }, 1000);
        }

        async function endGame() {
            clearInterval(timerInterval);
            const timeStr = document.getElementById('timerDisplay').innerText;
            
            if (currentGameMode === 'single') {
                showAlert('🎉 게임 클리어!', `기록: ${timeStr}`, '🏆');
                // 명예의 전당 저장
                try {
                    await addDoc(collection(db, `schools/${currentUser.school}/scores`), {
                        name: currentUser.name, // 원본 이름 저장, 표시할때 마스킹
                        time: secondsElapsed,
                        timeStr: timeStr,
                        pairCount: gameSettings.pairCount || 6,
                        createdAt: Date.now()
                    });
                } catch(e) { console.error(e); }
                setTimeout(() => { showScreen('studentScreen'); loadHallOfFame(); }, 2500);
            } else if (currentGameMode === 'multi') {
                showAlert('🎉 게임 종료!', '잠시 후 로비로 이동합니다.', '🏁');
                setTimeout(() => {
                    if(isHost && currentRoomId) {
                        updateDoc(doc(db, `schools/${currentUser.school}/rooms`, currentRoomId), {
                            status: 'waiting',
                            cards: [],
                            pairsLeft: 0
                        });
                    }
                }, 3000);
            }
        }

        window.quitGame = function() {
            if(confirm("정말 게임을 그만두시겠습니까?")) {
                clearInterval(timerInterval);
                if(currentGameMode === 'multi') leaveRoom(true);
                else showScreen('studentScreen');
            }
        }

        // -------------------------
        // 명예의 전당 로드
        // -------------------------
        async function loadHallOfFame() {
            const listDiv = document.getElementById('hofList');
            listDiv.innerHTML = '<p class="text-center text-gray-500">불러오는 중...</p>';
            try {
                // 혼자하기 기록 중 시간이 짧은 순으로 10명 표시
                const q = query(
                    collection(db, `schools/${currentUser.school}/scores`), 
                    orderBy('time', 'asc'), 
                    limit(15)
                );
                const querySnapshot = await getDocs(q);
                let html = '';
                let rank = 1;
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '🎖️';
                    html += `
                        <div class="flex justify-between items-center bg-white p-3 rounded-xl mb-2 shadow-sm border border-yellow-200">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">${medal}</span>
                                <span class="font-bold text-gray-700">${maskName(data.name)}</span>
                                <span class="text-xs text-gray-400">(${data.pairCount}쌍)</span>
                            </div>
                            <span class="font-black text-yellow-600 tracking-wider">${data.timeStr}</span>
                        </div>
                    `;
                    rank++;
                });
                if(!html) html = '<p class="text-center text-gray-500 mt-10">아직 기록이 없습니다. 첫 번째로 도전하세요!</p>';
                listDiv.innerHTML = html;
            } catch (e) { 
                console.error(e); 
                listDiv.innerHTML = '<p class="text-center text-red-500">기록을 불러오지 못했습니다.</p>';
            }
        }

    </script>
</body>
</html>
